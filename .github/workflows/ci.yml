name: ci

on: push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r lectures-and-labs/week10/cicd_lab/requirements.txt

      - name: Run tests
        run: python -m pytest
        working-directory: lectures-and-labs/week10/cicd_lab
